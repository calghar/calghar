<svg xmlns="http://www.w3.org/2000/svg" width="860" height="300" viewBox="0 0 860 300" role="img" aria-labelledby="t d">
  <title id="t">Farooq Shaikh</title>
  <desc id="d">Terminal window: Senior Security Researcher at Dynatrace. AI-driven vulnerability analysis, AI agent security, Kubernetes security. Projects: FORGE, Kimera, mcpvenom.</desc>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", monospace; white-space: pre; }
    .p    { font-size: 16px; fill: #64ffda; }
    .name { font-size: 46px; font-weight: 700; fill: #e6edf3; }
    .k    { font-size: 15px; fill: #64ffda; }
    .v    { font-size: 15px; fill: #c9d1d9; }
    /* Typing effect: each line is revealed by a clip rect whose width grows.
       Without animation the rects keep their full width attribute, so the
       final state is always the complete text. */
    @keyframes type { from { width: 0; } to { width: var(--w); } }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    .c1 { --w: 120px; animation: type 0.6s steps(8)  0.3s both; }
    .c2 { --w: 360px; animation: type 1.0s steps(13) 1.0s both; }
    .c3 { --w: 460px; animation: type 0.8s steps(48) 2.2s both; }
    .c4 { --w: 790px; animation: type 1.4s steps(84) 3.1s both; }
    .c5 { --w: 360px; animation: type 0.6s steps(35) 4.6s both; }
    .c6 { --w: 120px; animation: type 0.4s steps(2)  5.4s both; }
    .cursor { opacity: 0; animation: blink 1s steps(1) 5.8s infinite forwards; }
    @media (prefers-reduced-motion: reduce) {
      .c1, .c2, .c3, .c4, .c5, .c6, .cursor { animation: none; }
      .cursor { opacity: 1; }
    }
  </style>
  <defs>
