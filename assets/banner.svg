<svg xmlns="http://www.w3.org/2000/svg" width="860" height="330" viewBox="0 0 860 330" role="img" aria-labelledby="t d">
  <title id="t">Farooq Shaikh</title>
  <desc id="d">Terminal window: Senior Security Researcher at Dynatrace. AI-driven vulnerability analysis, AI agent security, Kubernetes security.</desc>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", monospace; white-space: pre; }
    .art  { font-size: 14px; fill: #64ffda; }
    .p    { font-size: 16px; fill: #64ffda; }
    .h    { font-size: 18px; fill: #e6edf3; font-weight: 700; }
    .s    { font-size: 15px; fill: #8b949e; }
    /* Typing effect: each line is revealed by a clip rect whose width grows.
       Without animation the rects keep their full width attribute, so the
       final state is always the complete text. */
    @keyframes type { from { width: 0; } to { width: var(--w); } }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    .c1 { --w: 120px; animation: type 0.6s steps(8) 0.3s both; }
    .c2 { --w: 640px; animation: type 1.2s steps(40) 1.1s both; }
    .c3 { --w: 420px; animation: type 1.0s steps(38) 2.5s both; }
    .c4 { --w: 720px; animation: type 1.4s steps(74) 3.6s both; }
    .c5 { --w: 120px; animation: type 0.4s steps(2) 5.2s both; }
    .cursor { opacity: 0; animation: blink 1s steps(1) 5.6s infinite both; }
    @media (prefers-reduced-motion: reduce) {
      .c1, .c2, .c3, .c4, .c5, .cursor { animation: none; }
      .cursor { opacity: 1; }
    }
  </style>
