    <clipPath id="k2"><rect class="c2" x="30"  y="90"  width="360" height="62"/></clipPath>
    <clipPath id="k3"><rect class="c3" x="30"  y="164" width="460" height="28"/></clipPath>
    <clipPath id="k4"><rect class="c4" x="30"  y="192" width="790" height="28"/></clipPath>
    <clipPath id="k5"><rect class="c5" x="30"  y="220" width="360" height="28"/></clipPath>
    <clipPath id="k6"><rect class="c6" x="30"  y="256" width="120" height="30"/></clipPath>
  </defs>

  <rect x="1" y="1" width="858" height="298" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
